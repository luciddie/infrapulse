services:
  alertmanager:
    volumes:
      - ./monitoring/alertmanager/alertmanager.telegram.yml:/etc/alertmanager/alertmanager.yml:ro

    secrets:
      - telegram_bot_token
      - telegram_chat_id

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token

  telegram_chat_id:
    file: ./secrets/telegram_chat_id
