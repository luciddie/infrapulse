services:
  postgres:
    image: postgres:17-alpine
    container_name: infrapulse-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: infrapulse
      POSTGRES_USER: infrapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrapulse -d infrapulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: infrapulse:dev
    restart: "no"
    command: ["alembic", "upgrade", "head"]

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: infrapulse
      DB_USER: infrapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: infrapulse:dev
    container_name: infrapulse-app
    restart: unless-stopped
    stop_grace_period: 30s

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: infrapulse
      DB_USER: infrapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-60}
      MONITORING_WORKERS: ${MONITORING_WORKERS:-4}
      INCIDENT_FAILURE_THRESHOLD: ${INCIDENT_FAILURE_THRESHOLD:-3}
      SERVICE_INCIDENT_FAILURE_THRESHOLD: ${SERVICE_INCIDENT_FAILURE_THRESHOLD:-3}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: infrapulse-prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=1GB"

  grafana:
    image: grafana/grafana:13.3.2
    container_name: infrapulse-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  alertmanager:
    image: prom/alertmanager:v0.35.1
    container_name: infrapulse-alertmanager
    restart: unless-stopped

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
