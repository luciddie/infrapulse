groups:
  - name: infrapulse_alerts
    rules:
      - alert: InfraPulseDown
        expr: up{job="infrapulse"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "InfraPulse is unavailable"
          description: "Prometheus cannot scrape InfraPulse."

      - alert: DeviceIncidentDetected
        expr: infrapulse_open_incidents{type="device"} > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Device incident detected"
          description: "InfraPulse has open device incidents."

      - alert: ServiceIncidentDetected
        expr: infrapulse_open_incidents{type="service"} > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Service incident detected"
          description: "InfraPulse has open service incidents."

      - alert: HighCheckDuration
        expr: histogram_quantile(0.95, sum by (le, protocol, job, instance) (rate(infrapulse_check_duration_seconds_bucket{job="infrapulse"}[5m]))) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High monitoring check duration"
          description: "P95 check duration exceeds 2 seconds."

      - alert: MonitoringSchedulerStalled
        expr: |
          up{job="infrapulse"} == 1
          and on(job, instance) infrapulse_monitoring_enabled{job="infrapulse"} == 1
          and on(job, instance) (
            infrapulse_monitoring_last_success_timestamp_seconds{job="infrapulse"} == 0
            or (
              (time() - infrapulse_monitoring_last_success_timestamp_seconds{job="infrapulse"})
              > on(job, instance) clamp_min(infrapulse_monitoring_interval_seconds{job="infrapulse"} * 2 + 60, 180)
            )
          )
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring scheduler stalled"
          description: "No successful monitoring cycles detected while monitoring is enabled."
