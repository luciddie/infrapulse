name: InfraPulse CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: infrapulse_test
          POSTGRES_USER: infrapulse
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U infrapulse -d infrapulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PASSWORD: ci_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: infrapulse_test
      DB_USER: infrapulse
      MONITORING_ENABLED: "false"
      TELEGRAM_ENABLED: "false"
      INCIDENT_FAILURE_THRESHOLD: "3"
      SERVICE_INCIDENT_FAILURE_THRESHOLD: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Check database connection
        run: python -c "from app.database import check_database; assert check_database()"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check database schema
        run: python -m alembic check

      - name: Run automated tests
        run: python -m pytest -v
